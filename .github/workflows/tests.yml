name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: unittest
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test.log 2>&1
          status=$?
          cat test.log
          # Surface each failure as an annotation so it is readable without opening the log.
          [ $status -eq 0 ] || python .github/annotate_failures.py test.log
          exit $status
